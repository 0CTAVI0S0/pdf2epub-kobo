[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub-kobo"
version = "0.2.0"
description = "Convierte PDFs de texto a EPUB/KEPUB listos para Kobo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Juan" }]
dependencies = [
  "PyMuPDF>=1.24.0",
  "ebooklib>=0.18",
  "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
pdf2epub = "src.cli:main"
pdf2epub-gui = "src.gui:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
