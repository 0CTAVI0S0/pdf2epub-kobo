name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm pdf2epub.spec
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2epub-kobo-windows
          path: dist/pdf2epub-kobo.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm pdf2epub.spec
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2epub-kobo-linux
          path: dist/pdf2epub-kobo
